name: dataset
description: >
  Preparador autônomo do dataset de benchmark: seleciona um subconjunto
  determinístico de imagens de entrada e gera as variantes JPEG/WebP
  (formato × qualidade × resolução) + manifest.json usadas pelo app e pelo
  servidor do benchmark. Não depende de nenhum outro pacote deste
  repositório.
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  image: ^4.9.1

dev_dependencies:
  test: ^1.25.0
  path: ^1.9.0
